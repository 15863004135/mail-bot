name: mail-daily
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send daily card
        env:
          MAIL163_USER: ${{ secrets.MAIL163_USER }}
          MAIL163_PASS: ${{ secrets.MAIL163_PASS }}
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python cloud_digest.py daily
