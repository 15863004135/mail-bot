name: mail-fetch
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mail-digest
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run digest
        env:
          MAIL163_USER: ${{ secrets.MAIL163_USER }}
          MAIL163_PASS: ${{ secrets.MAIL163_PASS }}
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python cloud_digest.py fetch
      - name: Save state
        run: |
          git config user.name "mail-bot"
          git config user.email "mail-bot@users.noreply.github.com"
          git add state.json pending.json
          git diff --quiet --cached || git commit -m "update state [skip ci]"
          git push || true
